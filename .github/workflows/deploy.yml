name: Deploy API to MonsterASP

# Builds the API and uploads it over FTPS. appsettings*.json are never uploaded: the server
# keeps its own appsettings.json with the real secrets, and App_Data (uploads) is left alone.
# Needs the repository secrets FTP_USER and FTP_PASSWORD.
on:
  push:
    branches: [master]
    paths: ["LifeDash.Api/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FTP_HOST: site102177.siteasp.net
  API_URL: https://gentlelife.runasp.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: |
          dotnet publish LifeDash.Api/LifeDash.Api.csproj -c Release -o publish
          rm -f publish/appsettings*.json

      - name: Upload over FTPS
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then echo "::error::Secrets FTP_USER / FTP_PASSWORD are missing."; exit 1; fi
          base="ftp://$FTP_HOST/wwwroot"
          up() { curl -sS --ssl-reqd --ftp-create-dirs --retry 3 --user "$FTP_USER:$FTP_PASSWORD" -T "$1" "$base/$2"; }

          # app_offline.htm stops the app so its DLLs aren't locked while they're replaced.
          echo '<html><body>GentleLife wird aktualisiert ...</body></html>' > app_offline.htm
          up app_offline.htm app_offline.htm
          sleep 5

          cd publish
          find . -type f ! -name web.config | sed 's|^\./||' | while read -r f; do up "$f" "$f"; done
          up web.config web.config
          cd ..

          curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" -Q "DELE /wwwroot/app_offline.htm" "ftp://$FTP_HOST/" -o /dev/null

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 60 "$API_URL/api/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::API did not report healthy after the deploy."
          exit 1
