name: Deploy API to MonsterASP

# Builds the API and uploads it over FTPS. appsettings*.json are never uploaded: the server
# keeps its own appsettings.json with the real secrets, and App_Data (uploads) is left alone.
# Needs the repository secrets FTP_USER and FTP_PASSWORD.
on:
  push:
    branches: [master]
    paths: ["LifeDash.Api/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  FTP_HOST: site102177.siteasp.net
  API_URL: https://gentlelife.runasp.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: |
          dotnet publish LifeDash.Api/LifeDash.Api.csproj -c Release -o publish
          rm -f publish/appsettings*.json

      # The FTP server sends its certificate without the Let's Encrypt intermediate. Windows fetches
      # that automatically, OpenSSL doesn't: download it from the certificate's AIA URL and check the
      # completed chain against the system trust store, so curl keeps verifying the server.
      - name: Complete the FTP server's certificate chain
        run: |
          echo | openssl s_client -starttls ftp -connect "$FTP_HOST:21" -servername "$FTP_HOST" 2>/dev/null \
            | openssl x509 > leaf.pem
          issuer_url=$(openssl x509 -in leaf.pem -noout -ext authorityInfoAccess | sed -n 's/.*CA Issuers - URI:\(.*\)/\1/p' | head -1)
          echo "Intermediate: $issuer_url"
          curl -fsS "$issuer_url" -o issuer.der
          openssl x509 -inform DER -in issuer.der -out issuer.pem 2>/dev/null || cp issuer.der issuer.pem
          openssl verify -untrusted issuer.pem leaf.pem
          cat /etc/ssl/certs/ca-certificates.crt issuer.pem > ftp-ca.pem

      - name: Upload over FTPS
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_USER" ] || [ -z "$FTP_PASSWORD" ]; then echo "::error::Secrets FTP_USER / FTP_PASSWORD are missing."; exit 1; fi
          base="ftp://$FTP_HOST/wwwroot"
          export CURL_CA_BUNDLE="$PWD/ftp-ca.pem"
          up() { curl -sS --ssl-reqd --ftp-create-dirs --retry 3 --user "$FTP_USER:$FTP_PASSWORD" -T "$1" "$base/$2"; }

          # app_offline.htm stops the app so its DLLs aren't locked while they're replaced.
          echo '<html><body>GentleLife wird aktualisiert ...</body></html>' > app_offline.htm
          up app_offline.htm app_offline.htm
          sleep 5

          cd publish
          find . -type f ! -name web.config | sed 's|^\./||' | while read -r f; do up "$f" "$f"; done
          up web.config web.config
          cd ..

          curl -sS --ssl-reqd --user "$FTP_USER:$FTP_PASSWORD" -Q "DELE /wwwroot/app_offline.htm" "ftp://$FTP_HOST/" -o /dev/null

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 60 "$API_URL/api/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::API did not report healthy after the deploy."
          exit 1
